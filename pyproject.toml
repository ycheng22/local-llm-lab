[project]
name = "local-llm-lab"
version = "0.1.0"
description = "Small-scale LLM capability research on a consumer GPU"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "transformers>=4.55",
    "trl>=0.20",
    "peft>=0.17",
    "bitsandbytes>=0.46",
    "accelerate>=1.10",
    "datasets>=4.0",
    "safetensors>=0.5",
    "pyyaml>=6.0",
    "pydantic>=2.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "psutil>=6.0",
    "pynvml>=12.0",
    "pytest>=8.0",
    "orjson>=3.10",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "mypy>=1.16",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
