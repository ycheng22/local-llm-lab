experiment:
  id: exp05_agent_2b
  description: "Agent loop evaluation on Qwen3.5-2B SFT"

model:
  id: Qwen/Qwen3.5-2B
  adapter_path: experiments/exp01_sft_v1/checkpoint-final
  cache_dir: D:/huggingface_cache
  local_files_only: true
  load_in_4bit: true
  device_map: auto

evaluation:
  dataset: data/train_complex_500.jsonl
  max_tasks: 20  # Agent loops are expensive, test on 20 tasks
  max_steps: 5

logging:
  output_dir: experiments
