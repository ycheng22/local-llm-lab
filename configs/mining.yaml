experiment:
  id: exp03_mining

model:
  id: Qwen/Qwen3.5-2B
  adapter_path: experiments/exp01_sft_v1/checkpoint-final
  cache_dir: D:/huggingface_cache
  local_files_only: true
  load_in_4bit: true

mining:
  dataset: data/train_5k.jsonl
  max_tasks: 500
  num_samples: 4

generation:
  max_new_tokens: 384
  temperature: 0.7
  top_p: 0.95
  do_sample: true

logging:
  output_dir: data/mined/exp03_mining
