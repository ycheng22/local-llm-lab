experiment:
  id: exp02_grpo_v1_5k_eval
  
model:
  id: Qwen/Qwen3.5-2B
  adapter_path: experiments/exp02_grpo_v1_5k/checkpoint-2750
  cache_dir: D:/huggingface_cache
  local_files_only: true
  load_in_4bit: true

quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  compute_dtype: bfloat16

evaluation:
  dataset: data/test.jsonl
  num_samples: [1, 4, 8]

generation:
  max_new_tokens: 384
  temperature: 0.7
  top_p: 0.95
  do_sample: true

logging:
  output_dir: experiments/exp02_grpo_v1_5k_eval
