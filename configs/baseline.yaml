experiment:
  id: exp00_baseline
  description: "Qwen3.5-2B baseline"

model:
  id: Qwen/Qwen3.5-2B
  cache_dir: "D:/huggingface_cache"
  local_files_only: true
  load_in_4bit: true
  device_map: auto

generation:
  max_new_tokens: 384
  temperature: 0.7
  top_p: 0.9
  do_sample: true

evaluation:
  dataset: data/test.jsonl
  num_samples: [1, 4, 8]

logging:
  output_dir: experiments/exp00_baseline
