experiment:
  id: exp01_sft_v1_eval
  description: "Qwen3.5-2B + LoRA SFT v1 evaluation on frozen test set"

model:
  id: Qwen/Qwen3.5-2B
  adapter_path: experiments/exp01_sft_v1/checkpoint-final
  cache_dir: "D:/huggingface_cache"
  local_files_only: true
  load_in_4bit: true
  device_map: auto

generation:
  max_new_tokens: 384
  temperature: 0.7
  top_p: 0.9
  do_sample: true

evaluation:
  dataset: data/test.jsonl
  num_samples: [1, 4, 8]

logging:
  output_dir: experiments
